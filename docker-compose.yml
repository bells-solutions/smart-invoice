# SmartInvoice - PostgreSQL Development Database
# This docker-compose file provides a PostgreSQL database for local development.
#
# Usage:
#   Start:  docker compose up -d
#   Stop:   docker compose down
#   Logs:   docker compose logs postgres
#   Clean:  docker compose down -v (removes data volume)
#
# The database is configured to match the default settings in backend/.env.example
# Connection details:
#   Host: localhost
#   Port: 5432
#   User: postgres
#   Password: postgres
#   Database: smartinvoice

services:
  postgres:
    image: postgres:13-alpine
    restart: always
    container_name: smartinvoice-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smartinvoice
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
  minio:
    image: quay.io/minio/minio:latest
    restart: always
    container_name: smartinvoice-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
    ports:
      - "9000:9000" # MinIO API
      - "9001:9001" # MinIO Console (Web UI)
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  postgres_data:
  minio_data:
